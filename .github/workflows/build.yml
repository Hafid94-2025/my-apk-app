name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake libltdl-dev ccache
          pip install --upgrade pip "cython<3.0" wheel "setuptools<70" sh
          pip install https://github.com/kivy/buildozer/archive/master.zip
      - name: Build APK
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types"
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: bin/*.apk
